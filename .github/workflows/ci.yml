name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: conciliador
          POSTGRES_USER: conciliador
          POSTGRES_PASSWORD: conciliador
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conciliador"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      # Aplica as migrations em um PostgreSQL real, ja que os testes de integracao usam SQLite
      - name: Apply migrations on PostgreSQL
        run: |
          dotnet tool restore
          dotnet ef database update \
            --project src/Conciliador.Infrastructure \
            --startup-project src/Conciliador.Infrastructure \
            --configuration Release --no-build \
            --connection "Host=localhost;Port=5432;Database=conciliador;Username=conciliador;Password=conciliador"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/results.trx"

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: conciliador-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: conciliador-web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npx ng build --configuration production

      - name: Test
        run: npx ng test --watch=false

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up --build --detach

      # Sobe tudo de verdade e confere login e listagem passando pelo nginx
      - name: Log in through the web container
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:5080/health > /dev/null; then break; fi
            sleep 2
          done
          curl --silent --fail http://localhost:8080/ > /dev/null
          token=$(curl --silent --fail -X POST http://localhost:8080/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@conciliador.local","password":"change-me"}' | jq -r .token)
          test -n "$token" && test "$token" != "null"
          curl --silent --fail http://localhost:8080/api/reconciliations -H "Authorization: Bearer $token" | jq -e '.total == 0'

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
